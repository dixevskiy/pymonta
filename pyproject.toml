[project]
name = "pycut"
version = "1.0.0"
description = "Video editing library for nerds"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-ffmpeg>=2.0.12",
    "scenedetect>=0.7.1",
    "whisper-timestamped>=1.15.9",
]

[project.urls]
"Homepage" = "https://codeberg.org/dixevskiy/pycut"
"Bug Tracker" = "https://codeberg.org/dixevskiy/pycut/issues"


[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[project.scripts]
pycut = "pycut.cli:main"
